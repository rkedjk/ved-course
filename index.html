<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffdd2d" id="theme-color-meta" />
    <meta
      name="description"
      content="Интерактивная лекция по учёту и анализу внешнеэкономической деятельности: живые примеры, игры, квизы."
    />
    <meta
      property="og:title"
      content="Учёт и анализ ВЭД — интерактивная лекция"
    />
    <meta
      property="og:description"
      content="ВЭД без зубрёжки: живые примеры, симулятор валютной позиции, калькулятор пошлин, квизы."
    />
    <meta property="og:type" content="website" />
    <meta name="apple-mobile-web-app-title" content="ВЭД лекция" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Учёт и анализ ВЭД — интерактивная лекция</title>
    <script>
      // Применяем тему до первого кадра, чтобы не было «вспышки»
      var t = "light";
      try {
        var s = JSON.parse(localStorage.getItem("ved-lecture") || "{}");
        t =
          (s.state && s.state.theme) ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
      } catch (e) {
        /* оставить светлую */
      }
      document.documentElement.dataset.theme = t;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
